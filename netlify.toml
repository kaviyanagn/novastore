# ─── Netlify Deployment Configuration ───────────────────────────────────────
# NovaStore E-Commerce App

[build]
  # Directory to publish (Vite output)
  publish = "dist"
  # Build command
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# ─── SPA Redirect Rule ───────────────────────────────────────────────────────
# Redirect ALL routes to index.html so React Router handles client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─── Security Headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ─── Cache: Static Assets ─────────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
